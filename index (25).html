<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cotizaciones de Navidad</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎄%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--pino:#0f3b2c;--rojo:#b91c1c;--oro:#f2b134;--crema:#fffaf0;--tx:#2b2118;--mu:#6f6256}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font:15px/1.45 Nunito,system-ui,Arial,sans-serif;background:radial-gradient(circle at 20% 0,#1b5a43,transparent 55%),linear-gradient(170deg,#0f3b2c,#0b2a20 60%,#3b1010) fixed}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(circle,#fff 1.5px,transparent 2.5px);background-size:120px 120px;opacity:.35;animation:nv 14s linear infinite}
@keyframes nv{to{background-position:30px 120px}}
@media(prefers-reduced-motion:reduce){body:before{animation:none}}
button,input,select,textarea{font:inherit}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;max-width:1100px;margin:0 auto;padding:18px 18px 8px}
h1{margin:0;font:700 clamp(26px,6vw,40px)/1.05 Fredoka,sans-serif;color:var(--crema)}
h1 small{display:block;font:600 14px Nunito,sans-serif;color:#cfe5d8;margin-top:4px}
.hb{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:800;cursor:pointer;background:var(--crema);color:var(--pino);box-shadow:0 3px 0 rgba(0,0,0,.3)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.btn.p{background:var(--oro);color:#3a2300}.btn.r{background:#dc2626;color:#fff}.btn.on{background:#111;color:#fff}.btn:disabled{opacity:.6;cursor:wait}
main{max-width:1100px;margin:0 auto;padding:10px 18px 100px}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:8px 0 22px}
.cat{position:relative;border:0;border-radius:18px;padding:20px 18px;color:#fff;text-align:left;cursor:pointer;font:700 clamp(17px,4vw,22px) Fredoka,sans-serif;background:var(--c);box-shadow:0 5px 0 rgba(0,0,0,.3);opacity:.8;overflow:hidden}
.cat:after{content:"";position:absolute;top:0;bottom:0;right:22px;width:14px;background:rgba(255,255,255,.28)}
.cat.on{opacity:1;outline:3px solid var(--oro);outline-offset:2px}
.cat small{display:block;margin-top:2px;font:700 13px Nunito,sans-serif;opacity:.9}
.blk{background:rgba(255,250,240,.1);border:1px solid rgba(255,250,240,.2);border-radius:20px;padding:16px;margin-bottom:20px}
.blk h2{margin:0 0 12px;font:700 20px Fredoka,sans-serif;color:var(--crema)}.blk h2 small{font:600 13px Nunito,sans-serif;color:#cfe5d8;margin-left:8px}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.cd{position:relative;background:var(--crema);border-radius:16px;overflow:hidden;cursor:pointer;box-shadow:0 6px 14px rgba(0,0,0,.3);transition:transform .15s}
.cd:hover{transform:translateY(-3px)}
.th{position:relative;height:140px;display:grid;place-items:center;font-size:44px;background:#eadfc8}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cb{padding:10px 12px 12px}.cb b{display:block;font-size:16px;margin-top:6px}
.cb p{margin:4px 0 6px;color:var(--mu);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cb small{color:var(--mu);font-weight:700}
.chip{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:800;color:#fff;background:var(--c)}
.dl{position:absolute;top:8px;right:8px;width:32px;height:32px;border:0;border-radius:50%;background:#dc2626;color:#fff;cursor:pointer;font-size:15px;z-index:2}
.st{background:var(--crema);border-radius:16px;padding:22px;text-align:center;font-weight:700;max-width:520px;margin:20px auto}
.md{display:none;position:fixed;inset:0;z-index:100;background:rgba(5,20,14,.7);align-items:center;justify-content:center;padding:14px}
.mc{position:relative;background:var(--crema);border-radius:20px;border-top:8px solid var(--c);padding:22px 20px 18px;width:100%;max-width:560px;max-height:92vh;overflow:auto}
.mc h3{margin:0 40px 8px 0;font:700 24px Fredoka,sans-serif}.mc h4{margin:16px 0 6px;font:700 16px Fredoka,sans-serif}
.mc .xx{position:absolute;top:10px;right:10px;width:34px;height:34px;border:0;border-radius:50%;background:#eadfc8;cursor:pointer;font-size:16px}
.mc label{display:block;margin-top:12px;font-weight:800;font-size:13px;color:var(--mu)}
.mc input,.mc select,.mc textarea{width:100%;margin-top:4px;padding:10px 12px;border:2px solid #e3d5b8;border-radius:12px;background:#fff;color:var(--tx)}
.mc textarea{min-height:100px;resize:vertical}
.ds{white-space:pre-wrap;margin:10px 0}.mu{color:var(--mu);font-weight:700}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ph img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block}
.mc iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;margin-bottom:10px;background:#000}
.ms{min-height:20px;margin-top:10px;font-weight:800;font-size:13px;color:#b91c1c}.ms.ld{color:var(--mu)}
.fx{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.mc .btn.w{box-shadow:inset 0 0 0 2px #e3d5b8,0 3px 0 rgba(0,0,0,.15)}
.mc.wd{max-width:1000px}
.vw{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}.vw.one{grid-template-columns:1fr}
@media(max-width:760px){.vw{grid-template-columns:1fr}}
.pv{position:relative;background:#000;border-radius:14px;overflow:hidden;align-self:start}.pv iframe{display:block;margin:0;border-radius:0}
.ar{position:absolute;top:42%;transform:translateY(-50%);width:38px;height:38px;border:0;border-radius:50%;background:rgba(255,255,255,.92);cursor:pointer;font-size:22px;font-weight:800;line-height:1;z-index:2}.ar.l{left:6px}.ar.rr{right:6px}
.vc{color:#fff;text-align:center;font-size:12px;font-weight:800;padding:6px;background:#111}
.big{width:100%;max-height:62vh;object-fit:contain;background:#eadfc8;border-radius:14px;display:block}
.tm{display:flex;gap:8px;margin-top:8px}.tm img{width:64px;height:64px;object-fit:cover;border-radius:8px;cursor:pointer;border:3px solid transparent}.tm img.on{border-color:var(--oro)}
.dz{margin-top:4px;border:2.5px dashed #c9b88f;border-radius:14px;padding:18px 12px;text-align:center;cursor:pointer;background:#fff;font-weight:800;color:var(--mu)}.dz small{font-weight:600}.dz.ov{border-color:var(--rojo);background:#fff1f1}
.fl{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.fi2{position:relative;width:78px;height:78px;border-radius:10px;overflow:hidden;background:#eadfc8;display:grid;place-items:center;font-size:28px}
.fi2 img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.fi2 button{position:absolute;top:3px;right:3px;width:22px;height:22px;border:0;border-radius:50%;background:#dc2626;color:#fff;cursor:pointer;font-size:11px;z-index:1}
.ph2{display:flex;gap:8px;margin-bottom:8px}.ph2 input{margin-top:0}
.mini{border:0;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:800;cursor:pointer;background:#eadfc8;color:var(--tx)}
.tbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 16px;color:#cfe5d8;font-weight:800}
.fich{position:fixed;top:0;left:-10000px;width:800px;background:#fffaf0;padding:28px;font-family:Nunito,Arial,sans-serif;color:#2b2118}
#tt{display:none;position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:20px;font-weight:800;z-index:200;max-width:90vw;text-align:center}
.btn.wa{background:#25d366;color:#053b1a;text-decoration:none;display:inline-block}.dl.ed{right:46px;background:#2563eb}.fi2.rm{opacity:.35}</style><script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script></head><body>
<header><h1>🎄 Cotizaciones de Navidad<small>Show infantil y decoración · cada persona sube sus opciones</small></h1>
<div class="hb"><button class="btn p" data-a="nueva">➕ Nueva cotización</button><button class="btn" id="mb" data-a="master">🔑 Master</button></div></header>
<main id="app"></main>
<div class="md" id="md"></div><div id="tt"></div>
<script>
/* ===== Configuración: pega aquí la URL de tu Apps Script (termina en /exec) ===== */
const API='https://script.google.com/macros/s/AKfycbzC0VSYwsMCtOsm_97DOhlThv1e5e5LwyUJWpsNM9pWcnQ29O-PEbkAbqXN91dR-tO7dg/exec';
const LIM=20*1024*1024;
const T={show:{n:'Show infantil',e:'🎭',c:'#be185d',l:'Animadora o empresa del show'},deco:{n:'Decoración',e:'🎄',c:'#15803d',l:'Empresa o persona de la decoración'}};
let ITEMS=[],FIL='',MASTER=false,NOM='';
try{NOM=localStorage.getItem('cz_n')||''}catch(e){}
const $=s=>document.querySelector(s);
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const th=(id,w)=>'https://drive.google.com/thumbnail?id='+encodeURIComponent(id)+'&sz=w'+w;
const okUrl=u=>/^https?:\/\//i.test(u||'');

async function api(o){const r=await fetch(API,{method:'POST',body:JSON.stringify(o)});const j=await r.json();if(j.error)throw new Error(j.error);return j}
async function cargar(){
 if(API.indexOf('PEGA_')==0){$('#app').innerHTML='<div class="st">Falta pegar la URL del Apps Script en el archivo (const API).</div>';return}
 $('#app').innerHTML='<div class="st">Cargando cotizaciones…</div>';
 try{const r=await fetch(API+'?accion=listar');const j=await r.json();ITEMS=j.items||[];R()}
 catch(e){$('#app').innerHTML='<div class="st">No se pudieron cargar las cotizaciones.<br><br><button class="btn p" data-a="reint">Reintentar</button></div>'}}

function R(){
 const n=k=>ITEMS.filter(x=>x.tipo==k).length;
 let h='<div class="cats">'+['show','deco'].map(k=>'<button class="cat'+(FIL==k?' on':'')+'" style="--c:'+T[k].c+'" data-a="fil" data-v="'+k+'">'+T[k].e+' '+T[k].n+'<small>'+n(k)+' opción'+(n(k)==1?'':'es')+(FIL==k?' · toca para ver todo':'')+'</small></button>').join('')+'</div>';
 const L=ITEMS.filter(x=>!FIL||x.tipo==FIL);
 if(L.length)h+='<div class="tbar">Descargar '+(FIL?T[FIL].n.toLowerCase():'todo')+':<button class="btn" data-a="dall" data-m="img">🖼 Imagen</button><button class="btn" data-a="dall" data-m="pdf">📄 PDF</button></div>';
 if(!L.length)h+='<div class="st">Aún no hay cotizaciones. Pulsa «Nueva cotización» para agregar la primera.</div>';
 else{const g={};L.forEach(x=>{const k=x.persona.trim().toLowerCase();(g[k]=g[k]||{n:x.persona.trim(),a:[]}).a.push(x)});
  h+=Object.values(g).map(b=>{b.a.sort((p,q)=>p.tipo<q.tipo?1:-1);return '<section class="blk"><h2>👤 '+E(b.n)+'<small>'+b.a.length+' cotización'+(b.a.length>1?'es':'')+'</small></h2><div class="gr">'+b.a.map(card).join('')+'</div></section>'}).join('')}
 $('#app').innerHTML=h;
 $('#mb').textContent=MASTER?'🔑 Master: activo':'🔑 Master';$('#mb').classList.toggle('on',MASTER)}

function card(x){const t=T[x.tipo]||T.show,f=x.archivos||[],im=f.filter(a=>a.m.indexOf('image/')==0),vd=f.filter(a=>a.m.indexOf('video/')==0),p=im[0]||vd[0];
 return '<div class="cd" data-a="ver" data-id="'+E(x.id)+'"><div class="th">'+t.e+(p?'<img src="'+th(p.id,500)+'" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">':'')+'</div>'
 +'<div class="cb"><span class="chip" style="--c:'+t.c+'">'+t.n+'</span><b>'+E(x.proveedor)+'</b>'+(x.tel?'<small>📞 '+E(x.tel)+'</small>':'')+'<p>'+E(x.descripcion)+'</p><small>📷 '+im.length+' fotos · 🎬 '+(vd.length+(okUrl(x.link)?1:0))+' videos</small><div style="margin-top:8px;display:flex;gap:6px"><button class="mini" data-a="dimg" data-id="'+E(x.id)+'">🖼 Imagen</button><button class="mini" data-a="dpdf" data-id="'+E(x.id)+'">📄 PDF</button></div></div>'
 +(MASTER?'<button class="dl ed" data-a="edit" data-id="'+E(x.id)+'" title="Editar">✏️</button><button class="dl" data-a="borrar" data-id="'+E(x.id)+'" title="Borrar">🗑</button>':'')+'</div>'}

function modal(h,c){const m=$('#md');m.innerHTML='<div class="mc" style="--c:'+(c||'#b91c1c')+'"><button class="xx" data-a="cerrar" aria-label="Cerrar">✕</button>'+h+'</div>';m.style.display='flex'}
function cerrar(){FORM=false;$('#md').style.display='none';$('#md').innerHTML=''}
function msg(t,ld){const m=$('#mm');if(m){m.textContent=t;m.className='ms'+(ld?' ld':'')}}
function busy(b){document.querySelectorAll('#md .btn').forEach(x=>x.disabled=b)}

let CUR=null,FILES=[];
function tels(x){return String(x.tel||'').split(' / ').filter(Boolean)}
function telBtn(n,x){let d=n.replace(/\D/g,'');if(d.indexOf('0051')==0)d=d.slice(2);if(d.length==9)d='51'+d;
 if(/^519\d{8}$/.test(d)){const m='Hola, te escribo por la cotización de «'+x.proveedor+'» para la Navidad. ¿Me podrías dar más información?';
  return '<a class="btn wa" href="https://wa.me/'+d+'?text='+encodeURIComponent(m)+'" target="_blank" rel="noopener">💬 '+E(n)+' · WhatsApp</a>'}
 return '<a class="btn p" style="text-decoration:none" href="tel:'+E(n.replace(/[^\d+]/g,''))+'">📞 '+E(n)+'</a>'}
function ver(id){const x=ITEMS.find(i=>i.id==id);if(!x)return;const f=x.archivos||[],t=T[x.tipo]||T.show;
 CUR={x:x,im:f.filter(a=>a.m.indexOf('image/')==0),vd:f.filter(a=>a.m.indexOf('video/')==0),vi:0,ii:0};
 modal('<h3>'+E(x.proveedor)+'</h3><span class="chip" style="--c:'+t.c+'">'+t.n+'</span> <span class="mu">cotizado por '+E(x.persona)+'</span>'
 +'<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">'+tels(x).map(n=>telBtn(n,x)).join('')+'</div>'
 +'<p class="ds">'+E(x.descripcion)+'</p><div id="gal"></div>'
 +(okUrl(x.link)?'<p><a class="btn p" style="display:inline-block;text-decoration:none" href="'+E(x.link)+'" target="_blank" rel="noopener">🎬 Ver video del enlace</a></p>':'')
 +'<div class="fx" style="justify-content:flex-start">'+(MASTER?'<button class="btn p" data-a="edit" data-id="'+E(x.id)+'">✏️ Editar</button>':'')+'<button class="btn" data-a="dimg" data-id="'+E(x.id)+'">🖼 Descargar imagen</button><button class="btn" data-a="dpdf" data-id="'+E(x.id)+'">📄 Descargar PDF</button></div>',t.c);
 $('.mc').classList.add('wd');gal()}
function gal(){const c=CUR,v=c.vd[0],i=c.im[0];
 const vh=v?'<div class="pv"><iframe src="https://drive.google.com/file/d/'+E(v.id)+'/preview" allow="autoplay" allowfullscreen></iframe>'+(c.vd.length>1?'<button class="ar l" data-a="vp">‹</button><button class="ar rr" data-a="vn">›</button>':'')+'<div class="vc">Video 1 de '+c.vd.length+'</div></div>':'';
 const ih=i?'<div><img class="big" src="'+th(i.id,1200)+'" alt="" referrerpolicy="no-referrer">'+(c.im.length>1?'<div class="tm">'+c.im.map((a,k)=>'<img class="'+(k?'':'on')+'" src="'+th(a.id,200)+'" data-a="im" data-i="'+k+'" alt="">').join('')+'</div>':'')+'</div>':'';
 $('#gal').innerHTML=vh||ih?'<div class="vw'+(vh&&ih?'':' one')+'">'+vh+ih+'</div>':(okUrl(c.x.link)?'':'<p class="mu">Esta cotización no tiene fotos ni videos.</p>')}
function setVd(d){const c=CUR;c.vi=(c.vi+d+c.vd.length)%c.vd.length;$('.pv iframe').src='https://drive.google.com/file/d/'+c.vd[c.vi].id+'/preview';$('.vc').textContent='Video '+(c.vi+1)+' de '+c.vd.length}
function setIm(k){const c=CUR;c.ii=k;$('.big').src=th(c.im[k].id,1200);document.querySelectorAll('.tm img').forEach((e,j)=>e.classList.toggle('on',j==k))}

function nueva(x){EDIT=x||null;EX=x?(x.archivos||[]).map(a=>({id:a.id,m:a.m,n:a.n,q:false})):[];DIRTY=false;FILES=[];FORM=true;if(!x)setTimeout(restauraBorrador,0);modal('<h3>'+(x?'Editar cotización':'Nueva cotización')+'</h3>'
 +'<label>Tu nombre<input id="fn" maxlength="60" value="'+E(NOM)+'" autocomplete="name"></label>'
 +'<label>¿Qué estás cotizando?<select id="ft"><option value="show">🎭 Show infantil</option><option value="deco">🎄 Decoración</option></select></label>'
 +'<label><span id="fl">'+T.show.l+'</span><input id="fp" maxlength="80"></label>'
 +'<label style="margin-bottom:4px">Número de contacto de la empresa</label><div id="tl"><div class="ph2"><input type="tel" inputmode="tel" maxlength="30" placeholder="Ej. 987 654 321"></div></div>'
 +'<button type="button" class="mini" style="margin-top:8px" data-a="addtel">＋ Agregar otro número</button>'
 +'<label>Descripción breve<textarea id="fd" maxlength="800" placeholder="Qué incluye, duración, precio…"></textarea></label>'
 +'<label>Fotos y videos (hasta 2 fotos y 3 videos)</label><div class="dz" id="dz" data-a="pick">📎 Arrastra aquí tus fotos y videos<br><small>o toca para elegirlos (videos de hasta 20 MB)</small></div>'
 +'<input id="fi" type="file" accept="image/*,video/*" multiple hidden><div class="fl" id="ex"></div><div class="fl" id="fl2"></div><div id="cnt" class="mu" style="font-size:12px;margin-top:4px">Fotos 0/2 · Videos 0/3</div>'
 +'<label>Enlace de video, si pesa más (opcional)<input id="fk" placeholder="https://"></label>'
 +'<div id="mm" class="ms"></div><div class="fx"><button class="btn w" data-a="cerrar">Cancelar</button><button class="btn p" data-a="enviar">'+(x?'Guardar cambios':'Guardar cotización')+'</button></div>','#b91c1c');if(x)rellena(x)}
function addF(list){const er=[];[...list].forEach(f=>{const im=f.type.indexOf('image/')==0,vd=f.type.indexOf('video/')==0;
 if(!im&&!vd){er.push('«'+f.name+'» no es foto ni video.');return}
 if(vd&&f.size>LIM){er.push('«'+f.name+'» pesa más de 20 MB.');return}
 if(cuenta(vd)>=(vd?3:2)){er.push('Máximo '+(vd?'3 videos':'2 fotos')+'.');return}
 FILES.push({f:f,v:vd,u:im?URL.createObjectURL(f):''})});pintaF();msg(er.join(' '))}
function pintaF(){$('#fl2').innerHTML=FILES.map((a,i)=>'<div class="fi2" title="'+E(a.f.name)+'">'+(a.v?'🎬':'<img src="'+a.u+'" alt="">')+'<button type="button" data-a="qf" data-i="'+i+'">✕</button></div>').join('');
 $('#cnt').textContent='Fotos '+cuenta(false)+'/2 · Videos '+cuenta(true)+'/3'}
const b64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(b)});
async function comp(f){if(f.type.indexOf('image/')!=0||f.type=='image/gif')return f;
 try{const b=await createImageBitmap(f),k=Math.min(1,1600/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext('2d').drawImage(b,0,0,c.width,c.height);
  const o=await new Promise(r=>c.toBlob(r,'image/jpeg',.82));return o||f}catch(e){return f}}
async function sube(id,nombre,mime,data){try{return await api({accion:'archivo',id,nombre,mime,data})}catch(e){return await api({accion:'archivo',id,nombre,mime,data})}}

async function enviar(){
 const n=$('#fn').value.trim(),k=$('#ft').value,p=$('#fp').value.trim(),d=$('#fd').value.trim(),lk=$('#fk').value.trim(),
  tel=[...document.querySelectorAll('#tl input')].map(i=>i.value.trim()).filter(Boolean);
 if(!n||!p||!tel.length||!d){msg('Completa tu nombre, el proveedor, al menos un número de contacto y la descripción.');return}
 if(tel.some(t=>t.replace(/\D/g,'').length<6)){msg('Revisa los números de contacto: alguno parece incompleto.');return}
 if(lk&&!okUrl(lk)){msg('El enlace debe empezar con https://');return}
 busy(true);msg(EDIT?'Guardando cambios…':'Guardando cotización…',true);
 try{let id;const dat={persona:n,tipo:k,proveedor:p,tel:tel,descripcion:d,link:lk};
  if(EDIT){id=EDIT.id;await api(Object.assign({accion:'editar',id:id},dat));
   for(const a of EX.filter(q=>q.q)){msg('Quitando archivos…',true);await api({accion:'quitar',id:id,fid:a.id})}}
  else id=(await api(Object.assign({accion:'crear'},dat))).id;
  for(let i=0;i<FILES.length;i++){msg('Subiendo archivo '+(i+1)+' de '+FILES.length+'…',true);const o=FILES[i].f,
   b=await comp(o),mime=b.type||o.type,nm=b===o?o.name:o.name.replace(/\.\w+$/,'')+'.jpg';await sube(id,nm,mime,await b64(b))}
  if(!EDIT){try{localStorage.setItem('cz_n',n);localStorage.removeItem(DR)}catch(e){}NOM=n}
  cerrar();await cargar()}
 catch(e){busy(false);msg('Error: '+e.message)}}
const cuenta=v=>FILES.filter(a=>a.v==v).length+EX.filter(a=>!a.q&&(a.m.indexOf('video/')==0)==v).length;
const PH='<div class="ph2"><input type="tel" inputmode="tel" maxlength="30" placeholder="Otro número"><button type="button" class="mini" data-a="qt">✕</button></div>';
function pintaEx(){const e=$('#ex');if(!e)return;e.innerHTML=EX.map((a,i)=>'<div class="fi2'+(a.q?' rm':'')+'" title="'+E(a.n||'')+'">'+(a.m.indexOf('video/')==0?'🎬':'')+'<img src="'+th(a.id,200)+'" alt="" referrerpolicy="no-referrer" onerror="this.remove()"><button type="button" data-a="qx" data-i="'+i+'">'+(a.q?'↩':'✕')+'</button></div>').join('')}

/* ===== Descargas (imagen y PDF) ===== */
const FD={};
function toast(t,auto){const e=$('#tt');e.textContent=t;e.style.display=t?'block':'none';if(auto)setTimeout(()=>toast(''),4500)}
async function dataImg(x,a){if(FD[a.id])return FD[a.id];const j=await api({accion:'foto',id:x.id,fid:a.id});return FD[a.id]=j.data?'data:'+j.mime+';base64,'+j.data:''}
async function ficha(x){
 const t=T[x.tipo]||T.show,f=x.archivos||[],im=f.filter(a=>a.m.indexOf('image/')==0),vn=f.filter(a=>a.m.indexOf('video/')==0).length+(okUrl(x.link)?1:0),s=[];
 for(const a of im){try{const u=await dataImg(x,a);if(u)s.push(u)}catch(e){}}
 const d=document.createElement('div');d.className='fich';
 d.innerHTML='<div style="display:inline-block;background:'+t.c+';color:#fff;border-radius:20px;padding:3px 14px;font-weight:800">'+t.e+' '+t.n+'</div>'
 +'<h2 style="font:700 30px Fredoka,Arial,sans-serif;margin:10px 0 2px">'+E(x.proveedor)+'</h2><div style="color:#6f6256;font-weight:700">Cotizado por '+E(x.persona)+'</div>'
 +(tels(x).length?'<div style="margin-top:10px;font-weight:800;font-size:18px">📞 '+tels(x).map(E).join(' &nbsp;·&nbsp; ')+'</div>':'')
 +'<p style="white-space:pre-wrap;font-size:16px;margin:14px 0">'+E(x.descripcion)+'</p>'
 +(s.length?'<div style="display:flex;gap:12px">'+s.map(u=>'<div style="flex:1;height:'+(s.length>1?300:420)+'px;border-radius:12px;background:url('+u+') center/cover no-repeat"></div>').join('')+'</div>':'')
 +(vn?'<div style="margin-top:12px;font-weight:700;color:#6f6256">🎬 '+vn+' video'+(vn>1?'s':'')+' adjunto'+(vn>1?'s':'')+(okUrl(x.link)?' · '+E(x.link):'')+'</div>':'')
 +'<div style="margin-top:16px;font-size:12px;color:#9a8c78;text-align:right">Cotizaciones de Navidad 🎄</div>';
 document.body.appendChild(d);
 try{await new Promise(r=>setTimeout(r,150));return await html2canvas(d,{scale:1.5,backgroundColor:'#fffaf0',useCORS:true})}finally{d.remove()}}
const dl=(u,n)=>{const a=document.createElement('a');a.href=u;a.download=n;document.body.appendChild(a);a.click();a.remove()};
async function bajar(ids,modo){
 const L=ids.map(id=>ITEMS.find(i=>i.id==id)).filter(Boolean);if(!L.length)return;
 if(typeof html2canvas=='undefined'||!window.jspdf){toast('Las herramientas de descarga aún cargan. Intenta en unos segundos.',1);return}
 const cs=[];
 try{for(let i=0;i<L.length;i++){toast('Preparando '+(i+1)+' de '+L.length+'…');cs.push(await ficha(L[i]))}
  const base=L.length==1?L[0].persona.trim()+'-'+L[0].proveedor.trim():'cotizaciones-navidad',fn=base.replace(/[^\w\-áéíóúñÁÉÍÓÚÑ]+/g,'_').slice(0,70);
  if(modo=='pdf'){const o=c=>c.width>c.height?'l':'p',p=new window.jspdf.jsPDF({unit:'px',format:[cs[0].width,cs[0].height],orientation:o(cs[0]),hotfixes:['px_scaling']});
   cs.forEach((c,i)=>{if(i)p.addPage([c.width,c.height],o(c));p.addImage(c.toDataURL('image/jpeg',.92),'JPEG',0,0,c.width,c.height)});p.save(fn+'.pdf')}
  else if(cs.length==1)dl(cs[0].toDataURL('image/png'),fn+'.png');
  else{const W=cs[0].width,G=16,MAX=14000;let g=[],h=0;const pg=[];
   cs.forEach(c=>{if(h+c.height>MAX&&g.length){pg.push(g);g=[];h=0}g.push(c);h+=c.height+G});pg.push(g);
   pg.forEach((g,k)=>{const c=document.createElement('canvas');c.width=W;c.height=g.reduce((s,q)=>s+q.height+G,0);const x=c.getContext('2d');x.fillStyle='#0f3b2c';x.fillRect(0,0,c.width,c.height);
    let y=0;g.forEach(q=>{x.drawImage(q,0,y);y+=q.height+G});dl(c.toDataURL('image/png'),fn+(pg.length>1?'-'+(k+1):'')+'.png')})}
  toast('')}catch(e){toast('No se pudo generar la descarga: '+e.message,1)}}
const ordenados=()=>ITEMS.filter(x=>!FIL||x.tipo==FIL).sort((a,b)=>{const p=a.persona.trim().toLowerCase(),q=b.persona.trim().toLowerCase();return p<q?-1:p>q?1:(a.tipo<b.tipo?1:-1)}).map(x=>x.id);

/* ===== Arrastrar y soltar ===== */
['dragover','dragleave','drop'].forEach(n=>document.addEventListener(n,e=>{e.preventDefault();const z=e.target.closest&&e.target.closest('#dz');
 if(n=='dragover'&&z)z.classList.add('ov');if(n=='dragleave'&&z)z.classList.remove('ov');
 if(n=='drop'&&z){z.classList.remove('ov');addF(e.dataTransfer.files)}}));

async function borrar(id){const x=ITEMS.find(i=>i.id==id);
 if(!x||!confirm('¿Borrar la cotización «'+x.proveedor+'» de '+x.persona+'? También se eliminan sus fotos y videos.'))return;
 try{await api({accion:'borrar',id});ITEMS=ITEMS.filter(i=>i.id!=id);R()}catch(e){alert('No se pudo borrar: '+e.message)}}

document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t){if(e.target.id=='md'&&DN&&DN.id=='md'&&!FORM)cerrar();return}
 const a=t.dataset.a,id=t.dataset.id;
 if(a=='fil'){FIL=FIL==t.dataset.v?'':t.dataset.v;R()}
 else if(a=='ver')ver(id);else if(a=='nueva')nueva();else if(a=='enviar')enviar();else if(a=='cerrar')intentaCerrar();
 else if(a=='master'){MASTER=!MASTER;R()}else if(a=='borrar')borrar(id);else if(a=='reint')cargar()
 else if(a=='pick')$('#fi').click();else if(a=='qf'){FILES.splice(+t.dataset.i,1);pintaF()}
 else if(a=='addtel'){const b=$('#tl');if(b.children.length<5){b.insertAdjacentHTML('beforeend','<div class="ph2"><input type="tel" inputmode="tel" maxlength="30" placeholder="Otro número"><button type="button" class="mini" data-a="qt">✕</button></div>')}}
 else if(a=='qt')t.parentElement.remove();else if(a=='vp')setVd(-1);else if(a=='vn')setVd(1);else if(a=='im')setIm(+t.dataset.i)
 else if(a=='edit')nueva(ITEMS.find(i=>i.id==id));else if(a=='qx'){const q=EX[+t.dataset.i];q.q=!q.q;DIRTY=true;pintaEx();pintaF()}
 else if(a=='dall')bajar(ordenados(),t.dataset.m);else if(a=='dimg')bajar([id],'img');else if(a=='dpdf')bajar([id],'pdf')});
document.addEventListener('change',e=>{if(e.target.id=='fi'){addF(e.target.files);e.target.value=''}if(e.target.id=='ft')$('#fl').textContent=T[e.target.value].l});
document.addEventListener('keydown',e=>{if(e.key=='Escape')intentaCerrar()});

(function(){try{const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');
 x.font='50px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('🎄',32,36);
 const l=document.createElement('link');l.rel='icon';l.type='image/png';l.sizes='64x64';l.href=c.toDataURL('image/png');document.head.appendChild(l)}catch(e){}})();

/* ===== Protección del formulario: no se cierra por accidente y guarda borrador ===== */
let FORM=false,DN=null,EDIT=null,EX=[],DIRTY=false;const DR='cz_borrador';
document.addEventListener('pointerdown',e=>{DN=e.target});
const hayDatos=()=>EDIT?(DIRTY||FILES.length||EX.some(a=>a.q)):FILES.length||['#fp','#fd','#fk'].some(q=>$(q)&&$(q).value.trim())||[...document.querySelectorAll('#tl input')].some(i=>i.value.trim());
function intentaCerrar(){if(FORM){if(hayDatos()&&!confirm('Tienes datos sin guardar. ¿Cerrar y perderlos?'))return;try{localStorage.removeItem(DR)}catch(e){}}cerrar()}
function guardaBorrador(){if(!FORM||EDIT||!$('#fp'))return;try{localStorage.setItem(DR,JSON.stringify({t:$('#ft').value,p:$('#fp').value,d:$('#fd').value,k:$('#fk').value,tel:[...document.querySelectorAll('#tl input')].map(i=>i.value)}))}catch(e){}}
function restauraBorrador(){try{const b=JSON.parse(localStorage.getItem(DR)||'null');if(!b||!$('#fp'))return;$('#ft').value=b.t||'show';$('#fl').textContent=T[$('#ft').value].l;$('#fp').value=b.p||'';$('#fd').value=b.d||'';$('#fk').value=b.k||'';
 (b.tel||[]).forEach((v,i)=>{if(i)$('#tl').insertAdjacentHTML('beforeend','<div class="ph2"><input type="tel" inputmode="tel" maxlength="30" placeholder="Otro número"><button type="button" class="mini" data-a="qt">✕</button></div>');document.querySelectorAll('#tl input')[i].value=v})}catch(e){}}
document.addEventListener('input',e=>{if(FORM&&e.target.closest&&e.target.closest('#md')){DIRTY=true;guardaBorrador()}});
cargar();
